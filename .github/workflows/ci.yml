name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable
      - name: Start local site
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:4173/; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Verify native Safari rent, return, and reload
        run: npm run test:safari

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests with coverage
        run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: npm run test:e2e
      - name: Check generated diagrams
        run: npm run diagrams:check
      - name: Build static site
        run: npm run build
